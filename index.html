<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#170e19"><title>SUPREME</title><link rel="stylesheet" href="style.css"></head>
<body>
<canvas id="fluid" aria-hidden="true"></canvas>
<main>
  <header><span class="mark" aria-hidden="true">✳</span><button id="sound" class="icon" aria-label="Включить или выключить звук" title="Звук">◖))</button></header>
  <section class="hero"><h1>SUPREME</h1><div class="horizon"></div></section>
  <section class="instrument" aria-label="Семплер">
    <div class="transport"><button id="play" class="play" aria-label="Воспроизвести фоновый трек"><span>▶</span></button><span class="track">Restik bgm<span class="track-line"></span></span><span id="time">00:00</span><span class="loop" aria-label="Бесконечный луп">∞</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.72" aria-label="Громкость фона"></div>
    <canvas id="wave" aria-label="Волна фонового трека"></canvas>
    <div class="pads">
      <button class="pad" data-index="0" aria-label="Запустить Rest 1"><span class="number">01</span><span class="pad-art"></span><span class="pad-bottom"><span>Rest 1</span><kbd>A</kbd></span><i></i></button>
      <button class="pad" data-index="1" aria-label="Запустить Rest 2"><span class="number">02</span><span class="pad-art"></span><span class="pad-bottom"><span>Rest 2</span><kbd>S</kbd></span><i></i></button>
      <button class="pad" data-index="2" aria-label="Запустить Rest 3"><span class="number">03</span><span class="pad-art"></span><span class="pad-bottom"><span>Rest 3</span><kbd>D</kbd></span><i></i></button>
      <button class="pad" data-index="3" aria-label="Запустить Rest 4"><span class="number">04</span><span class="pad-art"></span><span class="pad-bottom"><span>Rest 4</span><kbd>F</kbd></span><i></i></button>
      <button class="pad" data-index="4" aria-label="Запустить Rest 5"><span class="number">05</span><span class="pad-art"></span><span class="pad-bottom"><span>Rest 5</span><kbd>G</kbd></span><i></i></button>
    </div>
    <div class="base" aria-hidden="true"><span>● ● ● ● ●</span><span>∿</span><span>◦ ◦ ◦</span></div>
    <p id="status" role="status"></p>
  </section>
</main><script src="app.js"></script>
</body></html>
