<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#170e19"><title>SUPREME</title><link rel="stylesheet" href="style.css?v=scenes-1"></head>
<body>
<canvas id="fluid" aria-hidden="true"></canvas>
<main>
  <header><span class="mark" aria-hidden="true">✳</span><button id="sound" class="icon" aria-label="Включить или выключить звук" title="Звук">◖))</button></header>
  <section class="hero"><h1>SUPREME</h1><div class="horizon"></div></section>
  <section class="instrument" aria-label="Семплер">
    <nav id="scenes" aria-label="Сцены"></nav>
    <div class="transport"><button id="play" class="play" disabled aria-label="Воспроизвести фоновый трек"><span>▶</span></button><span class="track"><span id="track-name"></span><span class="track-line"></span></span><span id="time">00:00</span><span class="loop" aria-label="Бесконечный луп">∞</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.72" aria-label="Громкость фона"></div>
    <canvas id="wave" aria-label="Волна фонового трека"></canvas>
    <div class="pads"></div>
    <div class="base" aria-hidden="true"><span>● ● ● ● ●</span><span>∿</span><span>◦ ◦ ◦</span></div>
    <p id="status" role="status"></p>
  </section>
</main><script src="app.js?v=scenes-1"></script>
</body></html>
